                <p class="xanh"> Xuân về hoa nở khắp trời<br>Hạ sang nắng cháy rạng ngời<br>Thu về lá rụng bên thềm</p>
                <hr>
                <p class="do">Đông sang gió lạnh bên em đợi chờ<br>Bốn mùa lá bốn giấc mơ<br>Thời gian đi mãi ta chờ đợi ai</p>
                <hr>
                <p class="xanh">Một năm rồi lại một năm<br>Vẫn còn câu hát thì thầm quê hương<br>Chờ xuân nắng mới soi đường</p>
