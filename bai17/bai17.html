<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 17 - Kiểm tra biểu mẫu bằng JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="panel">
    <h1>Đăng ký tài khoản</h1><p>Nhập thông tin bên dưới để đăng ký.</p>
    <form id="register-form" novalidate>
      <div class="field"><label for="fullname">Họ và tên</label>
        <input id="fullname" type="text" aria-describedby="fullname-error">
        <small id="fullname-error"></small>
      </div>
      <div class="field"><label for="email">Email</label>
        <input id="email" type="email" aria-describedby="email-error">
        <small id="email-error"></small>
      </div>
      <div class="field"><label for="password">Mật khẩu</label>
        <input id="password" type="password" aria-describedby="password-error">
        <small id="password-error"></small>
      </div>
      <div class="field"><label for="confirm">Xác nhận mật khẩu</label>
        <input id="confirm" type="password" aria-describedby="confirm-error">
        <small id="confirm-error"></small>
      </div>
      <button>Đăng ký</button>
      <p id="message" role="status"></p>
    </form>
  </main>
  <script src="java.js"></script>
</body>
</html>
