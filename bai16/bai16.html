<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - Danh sách việc cần làm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="panel">
        <header>
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </header>
        <form id="task-form">
            <input id="task-input" aria-label="Việc cần làm" value="Hoàn thành bài tập Lập trình Web" placeholder="Nhập công việc..." required>
            <button>Thêm</button>
        </form>
        <ul id="task-list"></ul>
        <p class="summary">Còn <span id="remaining">0</span> việc chưa hoàn thành</p>
    </main>
    <script src="java.js"></script>
</body>
</html>
