<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 - Bảng điều khiển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex min-vh-100">

        <aside class="sidebar bg-dark text-white p-3 flex-shrink-0" style="width: 230px;">
            <div class="brand-title fw-bold fs-6 mb-4 px-2">
                CSE.TLU Admin
            </div>

            <ul class="nav nav-pills flex-column mb-auto gap-1">
                <li class="nav-item">
                    <a href="#" class="nav-link active text-white fw-medium py-2 px-3" aria-current="page">Bảng điều khiển</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white-50 py-2 px-3">Bài tập</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white-50 py-2 px-3">Sinh viên</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white-50 py-2 px-3">Điểm số</a>
                </li>
            </ul>
        </aside>

        <main class="flex-grow-1 bg-light p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h4 fw-bold text-dark m-0">Bảng điều khiển</h1>
                <div class="d-flex gap-2">
                    <span class="badge bg-warning text-dark d-flex align-items-center px-3 rounded-1">3 bài mới</span>
                    <button class="btn btn-primary btn-sm px-3 fw-medium">Xuất báo cáo</button>
                </div>
            </div>

            <section class="row g-3 mb-4">
                
                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <small class="text-secondary mb-1">Sinh viên</small>
                        <div class="fs-2 fw-bold text-dark mb-2">128</div>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-primary" role="progressbar" style="width: 70%;" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <small class="text-secondary mb-1">Đã nộp</small>
                        <div class="fs-2 fw-bold text-dark mb-2">96</div>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-success" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <small class="text-secondary mb-1">Chưa nộp</small>
                        <div class="fs-2 fw-bold text-dark mb-2">32</div>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-danger" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <small class="text-secondary mb-1">Điểm TB</small>
                        <div class="fs-2 fw-bold text-dark mb-2">7.8</div>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-warning" role="progressbar" style="width: 78%;" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

            </section>

            <section class="card border-0 shadow-sm p-4">
                <h2 class="h6 fw-bold text-dark mb-3">Tiến độ theo chương</h2>
                
                <div class="list-group list-group-flush border-top">
                    
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3 px-0">
                        <span class="small fw-medium text-secondary">Chương 1 — HTML5</span>
                        <span class="badge bg-success rounded-1 px-2 py-1">100%</span>
                    </div>

                    <div class="list-group-item d-flex justify-content-between align-items-center py-3 px-0">
                        <span class="small fw-medium text-secondary">Chương 2 — JavaScript</span>
                        <span class="badge bg-primary rounded-1 px-2 py-1">82%</span>
                    </div>

                    <div class="list-group-item d-flex justify-content-between align-items-center py-3 px-0">
                        <span class="small fw-medium text-secondary">Chương 3 — CSS3</span>
                        <span class="badge bg-info rounded-1 px-2 py-1">74%</span>
                    </div>

                    <div class="list-group-item d-flex justify-content-between align-items-center py-3 px-0">
                        <span class="small fw-medium text-secondary">Chương 4 — Bootstrap 5</span>
                        <span class="badge bg-secondary rounded-1 px-2 py-1">48%</span>
                    </div>

                </div>
            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="java.js"></script>
</body>
</html>
